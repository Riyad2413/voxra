name: Build Voxra APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Create Android Flutter project
        run: |
          flutter create --platforms=android voxra_build

      - name: Copy Voxra source
        run: |
          unzip -q Voxra_V1_Flutter_Project.zip -d /tmp/voxra_source
          cp /tmp/voxra_source/pubspec.yaml voxra_build/pubspec.yaml
          cp -r /tmp/voxra_source/lib voxra_build/lib

      - name: Build APK
        working-directory: voxra_build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxra-V1-APK
          path: voxra_build/build/app/outputs/flutter-apk/app-release.apk
